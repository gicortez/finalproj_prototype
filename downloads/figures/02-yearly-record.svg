   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #9bafa8" x="79.2" y="86.58" transform="rotate(-0 79.2 86.58)">Reported fireball events by calendar year · includes records without coordinates</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #9bafa8" transform="translate(79.2 415.064602)">Changes in reporting or sensor coverage can affect these counts. This is not a complete occurrence-rate series.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #9bafa8" transform="translate(79.2 428.22)">1988 begins in April. 2026 is excluded to avoid a partial-year comparison.</text>
